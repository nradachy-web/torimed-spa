<!-- Services and prices -->
<section class="band band--petal" id="services">
  <div class="wrap">
    <div class="band__head">
      <h2>Services and prices</h2>
      <p>Pick a category, add what you want, and send it to me as one booking request. You see the time and the total before you send anything.</p>
    </div>

    <div class="cats" role="tablist" aria-label="Service categories">
{{tabs}}
    </div>

    <div class="menu">
{{panels}}
    </div>

    <p class="menu__foot">Prices are in Canadian dollars. Times show how long to set aside. I confirm the final price with your appointment.</p>
  </div>
</section>
