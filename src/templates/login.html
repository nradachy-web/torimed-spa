<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in | ToriMed Spa</title>
<meta name="theme-color" content="#0a0a0a">
<script>
/* A phone that has signed in here before goes straight to the booking desk. If it has been
   signed out since, the desk sends it back here with ?signin and the form shows as usual. */
(function () {
  try {
    if (/[?&]signin\b/.test(location.search)) { localStorage.removeItem('torimed-desk'); return; }
    if (!location.hash && localStorage.getItem('torimed-desk')) {
      document.documentElement.className = 'is-going';
      location.replace('{{desk}}/api/door?site=' + encodeURIComponent(location.hostname));
    }
  } catch (e) { /* no storage: the form simply shows */ }
})();
</script>
<link rel="icon" href="/assets/img/logo-150.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/logo-150.png">
<link rel="preload" href="/assets/fonts/tenor-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css?v={{v}}">
<style>
/* Tori's sign-in to her booking desk. No tracking on this page, and nothing links to it. */
.is-going body { visibility: hidden; }
.door { min-height: 100svh; display: grid; background: var(--black); color: var(--on-dark); color-scheme: dark; }
.door__in { width: 100%; max-width: 432px; margin: 0 auto; align-self: start; padding: calc(env(safe-area-inset-top) + clamp(28px, 8svh, 80px)) 24px 48px; }
.door .brand { margin: 0 0 clamp(36px, 7svh, 60px); color: var(--on-dark); }
.door__title { font-size: clamp(1.75rem, 1.3rem + 2vw, 2.25rem); }
.door__lede { margin-top: 14px; color: var(--on-dark-2); }
.door__form { margin-top: 30px; display: grid; gap: 10px; }
.door__form label { font-size: 0.9375rem; color: var(--on-dark-2); }
.door__form input {
  width: 100%; min-height: 60px; padding: 10px 16px; border-radius: 8px;
  border: 1.5px solid var(--line-dark); background: var(--coal-2); color: var(--on-dark);
  font-size: 1.625rem; letter-spacing: 0.4em; text-align: center;
  transition: border-color 0.2s var(--ease);
}
.door__form input:hover { border-color: rgba(251, 246, 245, 0.4); }
.door__form input:focus-visible { outline: none; border-color: var(--blush); }
.door__form input + label, .door__row + label { margin-top: 10px; }
.door__row { display: grid; gap: 10px; }
.door__form input[type="tel"] { font-size: 1.3125rem; letter-spacing: 0.04em; }
.door__hint { margin-left: 6px; opacity: 0.75; }
.door__form .btn { margin-top: 14px; }
.door__form .btn[disabled] { opacity: 0.6; cursor: wait; }
.door__error { color: #ffb4b4; }
.door__fine { margin-top: 26px; font-size: 0.9375rem; color: var(--on-dark-2); }
.door__back { min-height: 44px; padding: 0; border: 0; background: none; color: var(--blush); text-decoration: underline; text-underline-offset: 4px; }
.door__back:hover { color: var(--white); }
.door :focus-visible { outline-color: var(--blush); }
@media (min-width: 720px) and (min-height: 720px) { .door__in { align-self: center; padding-top: 48px; } }
</style>
</head>
<body class="door">
<main class="door__in">
  <a class="brand" href="/" aria-label="ToriMed Spa home">
    <img class="brand__mark" src="/assets/img/logo-150.webp" width="150" height="150" alt="">
    <span class="brand__name">ToriMed Spa</span>
  </a>

  <section id="door-welcome" hidden>
    <h1 class="door__title" id="welcome-title">Welcome</h1>
    <p class="door__lede">This is your booking desk. Choose a PIN to open it. You will use the same PIN every time.</p>
    <form class="door__form" id="welcome-form" novalidate>
      <div class="door__row" id="phone-row">
        <label for="phone">Your mobile number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24">
      </div>
      <label for="next">Choose a PIN <span class="door__hint">6 to 8 numbers</span></label>
      <input id="next" name="next" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" maxlength="8" aria-describedby="welcome-error">
      <label for="again">Type your PIN again</label>
      <input id="again" name="again" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" maxlength="8" enterkeyhint="go">
      <p class="door__error" id="welcome-error" role="alert" hidden></p>
      <button class="btn btn--blush btn--block" type="submit" data-label="Open my desk" data-busy="One moment">Open my desk</button>
    </form>
    <p class="door__fine"><button class="door__back" type="button" id="to-pin">I already have a PIN</button></p>
  </section>

  <section id="door-pin" hidden>
    <h1 class="door__title">Sign in</h1>
    <p class="door__lede">Enter your PIN to open your booking desk.</p>
    <form class="door__form" id="pin-form" novalidate>
      <label for="pin">Your PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="8" enterkeyhint="go" aria-describedby="pin-error">
      <p class="door__error" id="pin-error" role="alert" hidden></p>
      <button class="btn btn--blush btn--block" type="submit" data-label="Open my desk" data-busy="One moment">Open my desk</button>
    </form>
    <p class="door__fine">Forgot your PIN? Message Nick and he will reset it.</p>
    <p class="door__fine" id="to-welcome-row" hidden><button class="door__back" type="button" id="to-welcome">First time here? Choose your PIN</button></p>
  </section>

  <noscript><p class="door__fine">This page needs JavaScript. You can also sign in at <a href="{{desk}}/login">the desk itself</a>.</p></noscript>
</main>

<script>
/* ToriMed Spa: signing in to the booking desk from torimed.ca/login.
   The desk lives at another address, so this page sends the PIN there, and a right PIN gets back
   a one minute pass that the browser then carries to the desk. The desk only answers this site.

   The first time, the desk tells this page that Tori has not chosen a PIN yet, and the page
   welcomes her: her mobile number shows it is her, and she chooses her PIN right here. */
(function () {
  'use strict';

  var DESK = '{{desk}}';
  var KEY = 'torimed-desk';
  var SAYS = {
    quiet: 'The desk did not answer. Check your connection and try again.',
    used: 'That link has already been used. Sign in with your PIN.',
    phone: 'Enter your mobile number with the area code.',
    shape: 'Your PIN needs to be 6 to 8 numbers.',
    mismatch: 'The two PINs are not the same. Type them both again.',
    short: 'Your PIN is 6 to 8 numbers.'
  };

  var $ = function (id) { return document.getElementById(id); };
  var stepWelcome = $('door-welcome'), stepPin = $('door-pin');
  var welcomeForm = $('welcome-form'), pinForm = $('pin-form');
  var phone = $('phone'), next = $('next'), again = $('again'), pin = $('pin');

  // Whether the desk is waiting for her to choose a PIN, and the name it gave.
  var canWelcome = false, welcomeName = '';
  // A starter code is the other proof of who she is: typed in as a PIN, or carried by a first-time
  // link after the #. With one in hand the mobile number is not asked for.
  var starter = '';
  var code = (location.hash.match(/^#start=(\d{6,8})$/) || [])[1] || '';
  if (location.hash || location.search) {
    try { history.replaceState(null, '', location.pathname); } catch (e) { /* the address just stays as typed */ }
  }

  function say(el, text) { el.textContent = text || ''; el.hidden = !text; }
  function busy(form, on) {
    var b = form.querySelector('button[type="submit"]');
    b.disabled = on;
    b.textContent = on ? b.getAttribute('data-busy') : b.getAttribute('data-label');
  }

  function ask(body, wait) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, wait || 15000);
    var status = 0;
    return fetch(DESK + '/api/door', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      cache: 'no-store',
      signal: ctl ? ctl.signal : undefined
    })
      .then(function (r) { status = r.status; return r.json(); })
      .then(function (a) { return a && typeof a === 'object' ? a : { ok: false, error: SAYS.quiet }; })
      .catch(function () { status = 0; return { ok: false, error: SAYS.quiet }; })
      .then(function (a) { clearTimeout(timer); a.status = status; return a; });
  }

  // Signed in. Remember this phone, then hand over to the desk. Replacing the page keeps the
  // back button from landing on a used form.
  function enter(address) {
    try { localStorage.setItem(KEY, '1'); } catch (e) { /* fine without it */ }
    location.replace(address);
  }

  function showPin(error) {
    starter = '';
    welcomeForm.reset();
    stepWelcome.hidden = true;
    stepPin.hidden = false;
    $('to-welcome-row').hidden = !canWelcome;
    busy(pinForm, false);
    say($('pin-error'), error);
    pin.value = '';
    pin.focus();
  }

  function showWelcome(name, starterCode) {
    starter = starterCode || '';
    $('welcome-title').textContent = name ? 'Welcome, ' + name : 'Welcome';
    $('phone-row').hidden = !!starter;
    stepPin.hidden = true;
    stepWelcome.hidden = false;
    busy(welcomeForm, false);
    say($('welcome-error'), '');
    (starter ? next : phone).focus();
  }

  function home() { if (canWelcome) showWelcome(welcomeName, ''); else showPin(''); }

  function tryPin(value, fromLink) {
    busy(pinForm, true);
    say($('pin-error'), '');
    ask({ pin: value }).then(function (a) {
      if (a.ok && a.go) return enter(a.go);
      if (a.ok && a.first) return showWelcome(a.first, value);
      showPin(fromLink && a.status === 401 ? SAYS.used : a.error || SAYS.quiet);
    });
  }

  pinForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var value = pin.value.replace(/\D/g, '');
    if (value.length < 6) { say($('pin-error'), SAYS.short); pin.focus(); return; }
    tryPin(value, false);
  });

  welcomeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var problem = !starter && phone.value.replace(/\D/g, '').length < 10 ? SAYS.phone
      : !/^\d{6,8}$/.test(next.value) ? SAYS.shape
      : next.value !== again.value ? SAYS.mismatch : '';
    if (problem) {
      say($('welcome-error'), problem);
      (problem === SAYS.phone ? phone : next).focus();
      return;
    }
    busy(welcomeForm, true);
    say($('welcome-error'), '');
    var body = starter ? { pin: starter, next: next.value, again: again.value } : { phone: phone.value, next: next.value, again: again.value };
    ask(body).then(function (a) {
      if (a.ok && a.go) return enter(a.go);
      // Someone has already chosen, or the starter code is spent: only signing in is left.
      if (a.closed || (starter && a.status === 401)) { canWelcome = false; return showPin(a.error || SAYS.quiet); }
      busy(welcomeForm, false);
      say($('welcome-error'), a.error || SAYS.quiet);
      // A wrong mobile number keeps the PIN she typed out of the way and puts her back on the number.
      next.value = ''; again.value = '';
      (!starter && a.status === 401 ? phone : next).focus();
    });
  });

  $('to-pin').addEventListener('click', function () { showPin(''); });
  $('to-welcome').addEventListener('click', function () { showWelcome(welcomeName, ''); });

  // Coming back to this page with the back button: never leave it stuck on "One moment".
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    document.documentElement.className = '';
    home();
  });

  if (code) { stepPin.hidden = false; tryPin(code, true); return; }
  // Ask the desk who is here. If it does not answer quickly, the sign-in form is the safe thing to show.
  ask({ hello: true }, 6000).then(function (a) {
    canWelcome = !!(a.ok && a.welcome);
    welcomeName = canWelcome ? String(a.welcome) : '';
    home();
  });
})();
</script>
</body>
</html>
